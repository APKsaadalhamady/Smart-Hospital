<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الصيدلي السريري - الردهات</title>
    <style>
        :root {
            --primary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #f4f7f6;
            --border: #ddd;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0; padding: 15px;
        }
        .app-container {
            max-width: 600px; margin: 0 auto;
            background: #fff; padding: 20px;
            border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select, textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border);
            border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        
        /* تصميم سلة الأدوية (البطاقات المضافة) */
        .cart-section {
            background: #f9f9f9; border: 1px solid var(--border);
            border-radius: 8px; padding: 15px; margin-bottom: 20px;
        }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 10px; border: 1px solid #eee;
            border-radius: 5px; margin-bottom: 8px; font-size: 14px;
        }
        .cart-item.exceptional { border-right: 4px solid var(--warning); }
        .delete-btn { color: var(--danger); cursor: pointer; font-weight: bold; border: none; background: none; }
        
        /* أزرار الإضافة (Accordion Triggers) */
        .action-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-action {
            flex: 1; padding: 10px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; color: #fff; text-align: center; font-size: 13px;
        }
        .btn-drug { background: var(--primary); }
        .btn-supply { background: #3498db; }
        .btn-except { background: var(--warning); }
        
        /* البطاقة القابلة للطي (Accordion Content) */
        .accordion-card {
            background: #fff; border: 2px solid var(--primary);
            border-radius: 8px; padding: 15px; margin-bottom: 20px;
            display: none; /* مخفية افتراضياً */
        }
        .accordion-card.active { display: block; }
        
        /* قائمة البحث الذكية */
        .search-results {
            border: 1px solid var(--border); border-top: none; max-height: 150px;
            overflow-y: auto; display: none; background: #fff; position: absolute; width: calc(100% - 30px); z-index: 10;
        }
        .search-item {
            padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between;
        }
        .search-item:hover { background: #f0f8ff; }
        .status-green { color: var(--success); font-weight: bold; font-size: 12px; }
        .status-red { color: var(--danger); font-weight: bold; font-size: 12px; }
        
        .btn-save-item {
            width: 100%; padding: 10px; background: var(--success); color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        
        .btn-submit-order {
            width: 100%; padding: 15px; background: var(--success); color: white;
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: var(--danger); font-size: 12px; display: none; margin-top: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>واجهة الصيدلي السريري</h2>
    
    <!-- معلومات المريض والردهة -->
    <div class="form-group">
        <label>الردهة</label>
        <select id="wardSelect">
            <option value="الباطنية رجال">الباطنية رجال</option>
            <option value="الباطنية نساء">الباطنية نساء</option>
            <option value="العناية المركزة">العناية المركزة</option>
        </select>
    </div>
    <div class="form-group">
        <label>اسم المريض الثلاثي</label>
        <input type="text" id="patientName" placeholder="مثال: محمد علي حسن">
    </div>

    <!-- سلة أدوية المريض -->
    <div class="cart-section">
        <label>أدوية ومستلزمات المريض الحالية:</label>
        <div id="cartItems">
            <!-- ستظهر الأدوية المضافة هنا -->
            <p style="font-size: 13px; color: #7f8c8d; text-align: center;">السلة فارغة حالياً</p>
        </div>
    </div>

    <!-- أزرار طي وفتح البطاقات -->
    <div class="action-buttons">
        <button class="btn-action btn-drug" onclick="openCard('drugCard')">+ إضافة دواء</button>
        <button class="btn-action btn-supply" onclick="openCard('supplyCard')">+ مستلزم</button>
        <button class="btn-action btn-except" onclick="openCard('exceptCard')">⚠️ استثنائي</button>
    </div>

    <!-- بطاقة إضافة الدواء (القابلة للطي) -->
    <div id="drugCard" class="accordion-card">
        <h4 style="margin-top: 0; color: var(--primary);">بحث وإضافة دواء</h4>
        <div class="form-group" style="position: relative;">
            <label>اسم الدواء (علمي أو تجاري)</label>
            <input type="text" id="drugSearch" placeholder="اكتب Flagyl أو Metronidazole..." onkeyup="searchDrug()">
            <div id="searchResults" class="search-results"></div>
            <div id="outOfStockMsg" class="error-msg">❌ هذا الدواء غير متوفر حالياً في الصيدلية الداخلية.</div>
        </div>
        
        <div class="form-group">
            <label>الشكل الدوائي (حسب المتوفر)</label>
            <select id="drugFormSelect" onchange="updateDoses()"><option>-- اختر الدواء أولاً --</option></select>
        </div>
        
        <div class="form-group">
            <label>الجرعة (حسب المتوفر)</label>
            <select id="drugDoseSelect"><option>-- اختر الشكل أولاً --</option></select>
        </div>

        <div class="form-group">
            <label>العدد المطلوب</label>
            <input type="number" id="drugQty" min="1" value="1">
        </div>
        <button class="btn-save-item" id="saveDrugBtn" onclick="addDrugToCart()">حفظ وطي البطاقة ⬇️</button>
        <button class="btn-save-item" style="background:#95a5a6; margin-top:5px;" onclick="closeCards()">إلغاء</button>
    </div>

    <!-- بطاقة الدواء الاستثنائي (القابلة للطي) -->
    <div id="exceptCard" class="accordion-card" style="border-color: var(--warning);">
        <h4 style="margin-top: 0; color: var(--warning);">طلب دواء استثنائي (غير مدرج)</h4>
        <div class="form-group"><label>الاسم</label><input type="text" id="excName" placeholder="اسم الدواء"></div>
        <div class="form-group"><label>الشكل والجرعة</label><input type="text" id="excDetails" placeholder="مثال: Vial 1g"></div>
        <div class="form-group"><label>العدد</label><input type="number" id="excQty" value="1" min="1"></div>
        <div class="form-group">
            <label>مبرر الطلب / ملاحظات (إجباري)</label>
            <textarea id="excNote" rows="2" placeholder="لماذا تطلب هذا الدواء؟"></textarea>
        </div>
        <button class="btn-save-item" style="background:var(--warning);" onclick="addExceptionalToCart()">حفظ كطلب استثنائي ⬇️</button>
    </div>

    <button class="btn-submit-order" onclick="submitFinalOrder()">إرسال طلبية المريض للصيدلية ✅</button>
</div>

<script>
    // قاعدة بيانات وهمية (تأتي لاحقاً من Firebase، يتحكم بها الصيادلة الداخليون)
    const hospitalFormulary = [
        { id: 1, scientific: "Metronidazole", brand: "Flagyl", available: true, forms: { "Vial": ["500 mg", "100 mg"], "Tablet": ["500 mg", "250 mg"] } },
        { id: 2, scientific: "Ceftriaxone", brand: "Rocephin", available: false, forms: { "Vial": ["1 g", "500 mg", "250 mg"] } }, // لاحظ أنه غير متوفر (أحمر)
        { id: 3, scientific: "Paracetamol", brand: "Perfalgan", available: true, forms: { "Vial": ["1 g"], "Tablet": ["500 mg"] } }
    ];

    let cart = []; // سلة أدوية المريض
    let selectedDrug = null; // الدواء المختار حالياً من البحث

    // فتح وإغلاق البطاقات
    function openCard(cardId) {
        closeCards();
        document.getElementById(cardId).classList.add('active');
    }
    function closeCards() {
        document.querySelectorAll('.accordion-card').forEach(card => card.classList.remove('active'));
    }

    // البحث الذكي
    function searchDrug() {
        const query = document.getElementById('drugSearch').value.toLowerCase();
        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '';
        document.getElementById('outOfStockMsg').style.display = 'none';
        document.getElementById('saveDrugBtn').disabled = false;

        if (query.length < 2) { resultsDiv.style.display = 'none'; return; }

        const filtered = hospitalFormulary.filter(d => 
            d.scientific.toLowerCase().includes(query) || d.brand.toLowerCase().includes(query)
        );

        if (filtered.length > 0) {
            resultsDiv.style.display = 'block';
            filtered.forEach(drug => {
                const div = document.createElement('div');
                div.className = 'search-item';
                const status = drug.available ? '<span class="status-green">🟢 متوفر</span>' : '<span class="status-red">🔴 نافذ</span>';
                div.innerHTML = `<span><b>${drug.scientific}</b> (${drug.brand})</span> ${status}`;
                div.onclick = () => selectDrug(drug);
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = 'none';
        }
    }

    // عند اختيار دواء من القائمة المنسدلة الذكية
    function selectDrug(drug) {
        selectedDrug = drug;
        document.getElementById('drugSearch').value = drug.scientific + ' (' + drug.brand + ')';
        document.getElementById('searchResults').style.display = 'none';
        
        // التحقق من التوفر
        if (!drug.available) {
            document.getElementById('outOfStockMsg').style.display = 'block';
            document.getElementById('saveDrugBtn').disabled = true; // منع الإضافة
            document.getElementById('drugFormSelect').innerHTML = '<option>-- غير متوفر --</option>';
            document.getElementById('drugDoseSelect').innerHTML = '<option>-- غير متوفر --</option>';
            return;
        }

        // تعبئة الأشكال الدوائية تلقائياً حسب المتوفر
        const formSelect = document.getElementById('drugFormSelect');
        formSelect.innerHTML = '<option value="">-- اختر الشكل --</option>';
        Object.keys(drug.forms).forEach(form => {
            formSelect.innerHTML += `<option value="${form}">${form}</option>`;
        });
        document.getElementById('drugDoseSelect').innerHTML = '<option>-- اختر الشكل أولاً --</option>';
    }

    // تعبئة الجرع بناءً على الشكل المختار
    function updateDoses() {
        if (!selectedDrug) return;
        const selectedForm = document.getElementById('drugFormSelect').value;
        const doseSelect = document.getElementById('drugDoseSelect');
        doseSelect.innerHTML = '<option value="">-- اختر الجرعة --</option>';
        
        if (selectedDrug.forms[selectedForm]) {
            selectedDrug.forms[selectedForm].forEach(dose => {
                doseSelect.innerHTML += `<option value="${dose}">${dose}</option>`;
            });
        }
    }

    // إضافة الدواء إلى السلة المصغرة
    function addDrugToCart() {
        const form = document.getElementById('drugFormSelect').value;
        const dose = document.getElementById('drugDoseSelect').value;
        const qty = document.getElementById('drugQty').value;

        if (!selectedDrug || !form || !dose) { alert('الرجاء إكمال كافة بيانات الدواء!'); return; }

        cart.push({ type: 'عادي', name: selectedDrug.scientific, form: form, dose: dose, qty: qty });
        renderCart();
        closeCards();
        document.getElementById('drugSearch').value = ''; // تصفير الحقل
    }

    // إضافة طلب استثنائي
    function addExceptionalToCart() {
        const name = document.getElementById('excName').value;
        const details = document.getElementById('excDetails').value;
        const qty = document.getElementById('excQty').value;
        const note = document.getElementById('excNote').value;

        if (!name || !note) { alert('الرجاء كتابة اسم الدواء ومبرر الطلب!'); return; }

        cart.push({ type: 'استثنائي', name: name, form: details, dose: note, qty: qty });
        renderCart();
        closeCards();
    }

    // رسم السلة (عرض الأدوية المضافة)
    function renderCart() {
        const cartDiv = document.getElementById('cartItems');
        if (cart.length === 0) {
            cartDiv.innerHTML = '<p style="font-size: 13px; color: #7f8c8d; text-align: center;">السلة فارغة حالياً</p>';
            return;
        }
        
        cartDiv.innerHTML = '';
        cart.forEach((item, index) => {
            const isExc = item.type === 'استثنائي';
            cartDiv.innerHTML += `
                <div class="cart-item ${isExc ? 'exceptional' : ''}">
                    <div>
                        <b>${item.name}</b> - ${item.form} ${isExc ? `<br><small style="color:red;">ملاحظة: ${item.dose}</small>` : `- ${item.dose}`}
                        <br><small>العدد: ${item.qty}</small>
                    </div>
                    <button class="delete-btn" onclick="removeFromCart(${index})">❌</button>
                </div>`;
        });
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        renderCart();
    }

    // الإرسال النهائي للصيدلية
    function submitFinalOrder() {
        const patient = document.getElementById('patientName').value;
        if (!patient || cart.length === 0) {
            alert('الرجاء إدخال اسم المريض وإضافة دواء واحد على الأقل.');
            return;
        }
        alert('تم إرسال طلبية المريض (' + patient + ') إلى الصيدلية الداخلية بنجاح! سيتم تجميعها هناك مع باقي طلبات الردهة.');
        // هنا يتم تفريغ البيانات لطلب مريض جديد
        cart = []; renderCart();
        document.getElementById('patientName').value = '';
    }
</script>
</body>
</html>
